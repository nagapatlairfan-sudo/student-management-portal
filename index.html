<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Student Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head>
<body><div class="login"><div class="art"><span class="logo" style="margin-bottom:18px">M</span><h1>Your semester, in one place.</h1><p>Attendance, results, timetable and fees for Meridian Institute students.</p></div>
<div class="form"><form id="loginForm" novalidate><h2 style="font-size:26px">Student sign in</h2><p style="color:var(--mut)">Use your registration number.</p>
<div class="f"><label for="sid">Student ID</label><input type="text" id="sid" autocomplete="username" placeholder="STU2026001"></div>
<div class="f"><label for="pw">Password</label><div class="pw"><input type="password" id="pw" autocomplete="current-password"><button type="button" id="tg" aria-label="Show or hide password"><i class="fa-solid fa-eye"></i></button></div></div>
<label><input type="checkbox" id="rem"> Remember me</label> <a href="#" style="float:right;color:var(--pri2)" onclick="alert('Demo only: use student123');return false">Forgot password?</a>
<div class="err" id="err" role="alert"></div><button class="btn full" type="submit"><span class="spin"></span>Sign in</button>
<div class="demo"><b>Demo mode.</b> Not secure authentication. Use <code>STU2026001</code> / <code>student123</code>.</div></form></div></div>
<script src="js/data.js"></script><script src="js/auth.js"></script></body></html>
